# Как добавить список слов без перевода
# Скопируйте файл и назовите <код-языка>-PASS_LIST.yml, например fr-FR-PASS_LIST.yml.
# Код должен совпадать с целевым языком. Файл .example.yml программа не использует.
# В ignore_list пишите только имена, марки и технические обозначения,
# которые должны остаться в переводе точно такими же, как в исходнике.
# Обычные слова и предложения сюда не добавляйте: их надо переводить.
# Каждый пункт начинается с двух пробелов и дефиса. Кавычки помогают
# сохранить пробелы, знаки и символы. Удалите пример перед использованием.
ignore_list:
  - 'Example Brand'
